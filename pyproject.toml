[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-nmr"
version = "0.1.0"
description = "Measurement-aware representation learning for plasma NMR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "torch>=2.3,<3",
  "scipy>=1.10,<2",
  "tabm==0.0.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mi-nmr = "mi_nmr.shared.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mi_nmr", "mi_nmr.*"]
namespaces = false

[tool.setuptools.package-data]
"mi_nmr.shared" = ["schema.json", "recipe.json"]
"mi_nmr.pretraining" = ["README.md"]
"mi_nmr.finetuning" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
